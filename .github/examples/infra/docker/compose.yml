# Copy to compose.yml on the Hetzner server (deploy workflow SCPs this file).
# Set IMAGE_TAG via environment when running docker compose.

services:
  app:
    image: ${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
