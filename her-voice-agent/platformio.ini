; ============================================================================
;  "Her" Voice Agent  -  ESP32-S3-Touch-AMOLED-1.43C
; ============================================================================
;  PlatformIO build config. Open this folder in Cursor (with the PlatformIO
;  extension installed) and the toolbar gets Build / Upload / Monitor buttons.
;
;  Board: ESP32-S3R8  (8MB octal PSRAM, 16MB flash), AMOLED 466x466,
;         ES8311 audio codec + onboard mic + speaker.
;
;  NOTE: there is no dedicated PlatformIO "board" file for this exact Waveshare
;  product, so we use the generic esp32-s3-devkitc-1 and override memory below.
;  This matches how Waveshare's own Arduino examples are configured.
; ============================================================================

[env:esp32-s3-amoled-1_43c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; --- memory layout (octal PSRAM + 16MB flash) ---
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial over native USB-C
    -DARDUINO_USB_MODE=1

lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    ; --- you will ADD the Waveshare driver libs here once you copy them in,
    ;     e.g. the AMOLED display driver, the touch driver, LVGL, and the
    ;     ES8311 codec helper. See README.md "Step 3".
